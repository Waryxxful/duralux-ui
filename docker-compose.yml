services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: duralux-demo:latest
    ports:
      - "5200:80"
    restart: unless-stopped

  dev:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run storybook -- --host 0.0.0.0"
    ports:
      - "6006:6006"
    environment:
      - CHOKIDAR_USEPOLLING=true
