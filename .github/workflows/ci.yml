name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build (incluye audit de contrato de fidelidad, dts y typecheck público)
        run: npm run build
